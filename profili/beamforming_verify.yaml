radar:
  c: 3e8
  fs: 10e6
  slope: 60.012e12
  fc: 77e9

capture:
  samples: 256
  chirps: 256
  rx: 4
  tx: 2
  x_frames: 1

fft:
  nfft_range: 512
  nfft_angle: 512
  workers: 8

display:
  vmax: 95
  vmin: 55
  vmin_norm: -25
  vmax_norm: 0
  range_max: 6.0
  crossrange_max: 3.0
  rangefft_db_min: 0
  rangefft_db_max: 95
  rangefft_lin_min: 0
  rangefft_lin_max: 15e7

dsp:
  window_range: blackman     # Keep range sidelobes low for an isolated target.
  window_angle: none         # Do not taper the virtual array during verification.

  mean_before_range_fft:
    enabled: true
    axes: [sample]           # Fast-time DC removal only.

  mean_after_range_fft:
    enabled: false
    axes: [range_bin]

  slow_time:
    enabled: false
    mode: none
    highpass_beta: 0.9
    doppler_fft_shift: true
    doppler_zero_notch: false

  background_subtraction:
    enabled: false
    mode: ema
    alpha: 0.02
    init_frames: 20
    window_frames: 20
    clamp_positive_only: false

  loop_average_after_background:
    enabled: false

  angle_processing:
    mode: fft
    mvdr_diagonal_loading: 0.02

  heatmap_ema:
    enabled: false
    alpha: 0.15

  heatmap_spatial_filter:
    enabled: false
    mode: gaussian_3x3

rx:
  stall_timeout_s: 2.0
  seq_reorder_max_back: 32
  telemetry_period_s: 0.2

process:
  priority:
    enabled: false
    main: above_normal
    rx: high
    logger: below_normal
    dsp: high
  affinity:
    enabled: false
    main: "24-31"
    rx: "24"
    logger: "25"
    dsp: "0-23"

debug:
  debug_stats: true

sar:
  frames_per_position: 8
  settling_delay_s: 0.4
