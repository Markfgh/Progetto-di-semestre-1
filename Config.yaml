radar:
  c: 3e8                 # Speed of light [m/s].
  fs: 10e6               # ADC sampling rate [Hz].
  slope: 60.012e12       # FMCW slope [Hz/s].
  fc: 77e9               # Carrier [Hz] (used for doppler axis in m/s).
  chirp_period_s: 160e-6 # Chirp repetition period [s].

capture:
  samples: 128   # ADC samples/chirp.
  chirps: 256    # Chirps/frame.
  rx: 4          # Current IQ conversion assumes RX=4.
  tx: 2          # Doppler axis calibration currently tuned for TX=2 TDM-MIMO.
  x_frames: 1    # Frames processed per DSP batch.

fft:
  nfft_range: 512 # Typical: 256 or 512. Higher = finer range bins, more CPU.
  nfft_angle: 256 # Typical: 128/256/512. Higher = finer angular grid, more CPU.
  workers: 8      # FFT worker threads.

display:
  vmax: 95           # Color scale max in RAW mode.
  vmin: 55           # Color scale min in RAW mode.
  vmin_norm: -20     # Normalized mode: typical clean range -25..-15 dB.
  vmax_norm: 0       # Normalized mode peak.
  range_max: 12.5     # Hard limit shown on Y axis [m].
  crossrange_max: 3.0 # Hard limit shown on X axis [m].
  rangefft_db_min: 0
  rangefft_db_max: 95
  rangefft_lin_min: 0
  rangefft_lin_max: 15e7

dsp:
  window_range: rectangular # Options: none, rectangular, hanning, hamming, blackman.
  window_doppler: rectangular # Applied on slow-time chirps before Doppler FFT.
  window_angle: rectangular  # Options: none, rectangular, hanning, hamming, blackman.

  mean_before_range_fft:
    enabled: false
    axes: [sample] # Options: frame, loop, tx, sample, range_bin, rx.
                   # Suggested for realtime: [sample] (stable DC removal).

  mean_after_range_fft:      
    enabled: false
    axes: [range_bin] # Usually keep disabled to avoid over-flattening targets.

  slow_time:
    enabled: false # Doppler processing can be costly and may not be needed for static scenes.
    mode: mean_subtraction # Options: none, mean_subtraction, highpass, doppler_fft.
    highpass_beta: 0.9 # Used only in highpass mode. Typical: 0.85..0.98.
    doppler_fft_shift: true
    doppler_zero_notch: false # In doppler_fft mode, can suppress static center line.

  background_subtraction:
    enabled: false # Can help with static clutter, but may cause artifacts on moving targets.
    mode: ema # Options: ema, running_mean, window_mean, frozen.
    alpha: 0.02 # EMA speed: lower=more stable, higher=faster adaptation.
    init_frames: 40 # Warmup frames before model init.
    window_frames: 20 # Used by window_mean mode.
    clamp_positive_only: true # Cleaner display floor, less negative artifacts.

  loop_average_after_background:
    enabled: false # If true reduces flicker, but can blur dynamics.

  angle_processing:
    mode: fft # Options: fft, bartlett, mvdr. "beamforming" is not a valid value.
    mvdr_diagonal_loading: 0.02 # Used only if mode=mvdr. Typical: 0.005..0.05.

  heatmap_ema:
    enabled: false
    alpha: 0.10 # Typical: 0.08..0.20. Lower=less jitter, more latency.

  heatmap_spatial_filter:
    enabled: false
    mode: gaussian_3x3 # Options: gaussian_3x3, none.

tracking:
  enabled: false
  dt_s: 0.04096 # Fixed frame period: 256 chirps * 160 us = 40.96 ms.
  model: kalman_cv_2d
  max_tracks: 24
  min_hits_to_confirm: 4
  max_missed_tentative: 1
  max_missed_confirmed: 3
  max_track_age: 0 # 0 disables age-based deletion.
  gating_xy_m: 0.60
  gating_doppler_mps: 0.70
  process_noise_pos: 0.12
  process_noise_vel: 0.60
  measurement_noise_xy: 0.18
  static_speed_threshold_mps: 0.08
  dynamic_speed_threshold_mps: 0.20
  doppler_static_threshold_mps: 0.10
  classification_confirm_frames: 3
  use_doppler_in_cost: true
  use_detection_class_in_cost: true
  history_len: 10
  debug_log: false
  # Legacy aliases still accepted by the parser:
  # min_confirmed_hits, max_missed_frames, process_noise_xy, process_noise_v

detection_static:
  enabled: false
  threshold_mode: absolute # Options: relative, absolute.
  threshold_db: -1 # Relative mode: threshold = max_db + threshold_db.
  localmax_range_bins: 3 # NMS neighborhood in range bins.
  localmax_angle_bins: 15 # NMS neighborhood in angle bins.
  min_power_db: 8 # Absolute safety floor (also in relative mode).
  max_detections: 20 # Cap per frame.

detection_moving:
  enabled: false
  threshold_mode: relative # Options: relative, absolute.
  threshold_db: -6
  localmax_range_bins: 8
  localmax_doppler_bins: 4
  zero_doppler_exclusion_bins: 12 # Keep slow movers while still suppressing zero-speed clutter.
  min_power_db: 5
  max_detections: 1

fusion:
  enabled: false
  merge_xy_m: 0.25
  merge_range_m: 0.20
  merge_angle_deg: 3.0
  prefer_moving_when_doppler_valid: true

rx:
  stall_timeout_s: 2.0
  seq_reorder_max_back: 32
  telemetry_period_s: 0.2

process:
  priority:
    enabled: false # Enable only after validating system stability.
    main: above_normal
    rx: high
    logger: below_normal
    dsp: high
  affinity:
    enabled: false # Pinning can help jitter, but depends on CPU topology.
    main: "24-31"
    rx: "24"
    logger: "25"
    dsp: "0-23"

debug:
  debug_stats: true # Enable DSP timing and range stats.

sar:
  frames_per_position: 8
  settling_delay_s: 0.4
