data:
  # Puoi mettere direttamente una run: logs/run_YYYYMMDD_HHMMSS
  # Se lasci "logs", SARReader prende automaticamente l'ultima run con capture_pos*.bin.
  input_dir: logs\run_20260401_111047

scan:
  x_start: 1
  x_end: 1
  x_step: 1
  x_pitch_m: 0.007792 # 7.7792mm pitch 

reconstruction:
  algorithm: synthetic_range_angle # Options: backprojection, synthetic_range_angle.

bp:
  mode: mimo_sar # BackProjection MIMO per scena statica, con selezione Doppler zero
  phase_sign: -1
  motion_mode: static_zero_doppler
  tx_offsets_lambda: null
  rx_offsets_lambda: null
  tx_offsets_m: null
  rx_offsets_m: null
  coherent_sum: true

offline_sar_range_angle:
  use_realtime_filters: true
  window_range: hanning
  window_doppler: hanning
  window_angle: hanning
  zero_after_range_fft_bins: 0

  mean_after_range_fft:
    enabled: false
    axes: [range_bin]

  slow_time:
    enabled: false
    mode: mean_subtraction
    highpass_beta: 0.9
    doppler_fft_shift: true
    doppler_zero_notch: false

  background_subtraction:
    enabled: false
    mode: frozen
    alpha: 0.02
    init_frames: 40
    window_frames: 40
    clamp_positive_only: false

  loop_average_after_background:
    enabled: false

  angle_processing:
    mode: bartlett # Options: fft,bartlett, mvdr
    mvdr_diagonal_loading: 0.02
    aggregation: frame_loop
    frame_index: 0
    loop_index: 0
