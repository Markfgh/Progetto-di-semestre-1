data:
  # Puoi mettere direttamente una run: logs/run_YYYYMMDD_HHMMSS
  # Se lasci "logs", SARReader prende automaticamente l'ultima run con capture_pos*.bin.
  input_dir: C:\py\RealTimePocessing\logs\run_20260401_111047

scan:
  x_start: 1
  x_end: 1
  x_step: 1
  x_pitch_m: 0.007792 # 10mm pitch 

bp:
  mode: mimo_sar # opzioni: sar_only | mimo_sar
  phase_sign: -1 # usa +1 se vuoi invertire il verso di fase
  avg_mode: both # gestito dal controller runtime (frame/loop), mai antenna in mimo_sar
  virtual_ant_pitch_m: 0.001948 # prima approssimazione phase-center: array lineare uniforme
  use_virtual_antennas: true
  coherent_sum: true


  # Con d = 1.948 mm, i valori pratici diventano:
  #
  # 1 * d = 1.948 mm
  # 2 * d = 3.896 mm
  # 4 * d = 7.792 mm
  # 8 * d = 15.584 mm
  #
  # Il più interessante per te è questo:
  #
  # scan.x_pitch_m = 0.015584 m → massima estensione dell’apertura senza buchi tra il blocco di 8 antenne di una posizione e quello della posizione successiva.
  #
  # scan.x_pitch_m = 0.007792 m → 50% di overlap, più robusto e più “pulito” se la geometria virtuale reale non è perfettamente quella uniforme del modello.
  #
  # scan.x_pitch_m = 0.003896 m → super-campionamento dell’apertura, molto conservativo ma più lento e con tanta ridondanza.
